adaptive:
  - at: 0
    colors: ['#2a3556', '#181f3a', '#44557a', '#0d1122']
  - at: 0.35
    colors: ['#5b4478', '#35284f', '#8a6390', '#191027']
  - at: 0.7
    colors: ['#a84a68', '#68304f', '#c0705f', '#2d1524']
  - at: 1
    colors: ['#c67d4c', '#98463f', '#c9834f', '#38190f']
